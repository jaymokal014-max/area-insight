                  setData(jsonData.data); 
                } else {
                  throw new Error("Invalid API structure");
                }
              } catch (error) {
                // The expected behavior when hosted purely as a Static Site on Render
                console.log("Secure Backend offline. Applying Offline Fallback Data.");
                setApiStatus("fallback");
                setData(fallbackData); 
              } finally {
                setTimeout(() => setIsLoading(false), 1200);
              }
            };
            fetchSecureData();
          }, []);

          const triggerHaptic = (type = 'light') => {
            if (navigator.vibrate) {
              if (type === 'heavy') navigator.vibrate(50);
              else if (type === 'sos') navigator.vibrate([100, 50, 100, 50, 300]);
              else navigator.vibrate(15);
            }
          };

          useEffect(() => {
            window.speechSynthesis.getVoices();
            return () => window.speechSynthesis.cancel();
          }, []);
          
          const nationalData = useMemo(() => data.find(d => d.state.includes("Total") || d.state.includes("India")) || fallbackData[29], [data]);
          const stateList = useMemo(() => data.filter(d => !d.state.includes("Total") && !d.state.includes("India")), [data]);
          const stateData = useMemo(() => stateList.find(d => d.state === selectedState) || stateList[0] || fallbackData[13], [stateList, selectedState]); 
          
          const yoyChange = ((stateData.y2022 - stateData.y2021) / stateData.y2021) * 100;
          const isTrendUp = yoyChange > 0;
          const isSafe = stateData.rate <= nationalData.rate;

          useEffect(() => {
            setAnimateKey(prev => prev + 1);
            setTipIndex(0);
            setA11yAnnouncement(`${t.a11yUpdated} ${stateData.state}`);
          }, [selectedState, language, stateData.state, t.a11yUpdated]);

          const handleReadAloud = () => {
            triggerHaptic('heavy');
            if (isSpeaking) {
              window.speechSynthesis.cancel();
              setIsSpeaking(false);
              return;
            }

            const formattedCases = t.langCode.includes('in') ? stateData.y2022.toLocaleString('en-IN') : stateData.y2022;
            const currentTip = isSafe ? t.tipSafe[tipIndex] : t.tipDanger[tipIndex];

            let speechText = t.voicePrompt
              .replace('{area}', stateData.state)
              .replace('{status}', isSafe ? t.safe : t.danger)
              .replace('{pop}', stateData.pop)
              .replace('{cases}', formattedCases)
              .replace('{trendPct}', Math.abs(yoyChange).toFixed(1))
              .replace('{trendDir}', isTrendUp ? t.trendUpWord : t.trendDownWord)
              .replace('{chargeRate}', stateData.charge)
              .replace('{rate}', stateData.rate)
              .replace('{natRate}', nationalData.rate)
              .replace('{womenPct}', Math.floor(stateData.rate * 0.18))
              .replace('{cyberPct}', Math.floor(stateData.rate * 0.12))
              .replace('{autoPct}', Math.floor(stateData.rate * 0.45))
              .replace('{tip}', currentTip);

            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = t.langCode;
            utterance.rate = 0.9; 
            
            const voices = window.speechSynthesis.getVoices();
            const nativeVoice = voices.find(voice => voice.lang.includes(t.langCode));
            if (nativeVoice) utterance.voice = nativeVoice;
            
            utterance.onstart = () => setIsSpeaking(true);
            utterance.onend = () => setIsSpeaking(false);
            utterance.onerror = () => setIsSpeaking(false);

            window.speechSynthesis.speak(utterance);
          };

          const startListening = () => {
            triggerHaptic('heavy');
            setMicError(false);
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { setMicError(true); return; }
            
            const recognition = new SpeechRecognition();
            recognition.lang = t.langCode;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => { setIsListening(true); setA11yAnnouncement(t.listening); };
            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript.toLowerCase();
              const found = stateList.find(d => transcript.includes(d.state.toLowerCase()));
              if (found) {
                setSelectedState(found.state);
                triggerHaptic('light');
                setTimeout(() => document.getElementById('play-audio-btn')?.click(), 500);
              }
              setIsListening(false);
            };
            recognition.onerror = () => { setIsListening(false); setMicError(true); setA11yAnnouncement(t.micError); };
            recognition.onend = () => setIsListening(false);
            recognition.start();
          };

          const handleNextTip = () => {
            triggerHaptic('light');
            setTipIndex((prev) => (prev + 1) % (isSafe ? t.tipSafe.length : t.tipDanger.length));
          };

          const encodedSosText = encodeURIComponent(t.sosText);

          const maxCases = Math.max(stateData.y2020, stateData.y2021, stateData.y2022);
          const minCases = Math.min(stateData.y2020, stateData.y2021, stateData.y2022);
          const range = maxCases - minCases || 1; 
          const getY = (val) => 40 - ((val - minCases) / range) * 30; 
          const p1 = `10,${getY(stateData.y2020)}`;
          const p2 = `50,${getY(stateData.y2021)}`;
          const p3 = `90,${getY(stateData.y2022)}`;
          const trendColor = stateData.y2022 > stateData.y2020 ? 'stroke-rose-500' : 'stroke-emerald-400';

          if (isLoading) {
            return (
              <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6" role="status" aria-live="polite">
                <div className="relative" aria-hidden="true">
                  <div className="absolute inset-0 bg-blue-500 rounded-full animate-ping opacity-20 scale-150"></div>
                  <div className="relative bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-3xl shadow-[0_0_50px_rgba(37,99,235,0.4)] border border-blue-400/30 mb-8">
                    <i className="fa-solid fa-database text-white text-6xl"></i>
                  </div>
                </div>
                <h1 className="text-3xl font-black text-white mb-2 tracking-wide text-center">AreaInsight</h1>
                <div className="flex items-center gap-3 text-emerald-400 bg-emerald-900/30 px-6 py-3 rounded-full border border-emerald-500/30">
                  <i className="fa-solid fa-spinner fa-spin text-lg" aria-hidden="true"></i>
                  <p className="font-bold uppercase tracking-widest text-xs">{t.fetchingData}</p>
                </div>
              </div>
            );
          }

          return (
            <div className="relative" key={animateKey}>
              <div className="sr-only" aria-live="polite" aria-atomic="true">{a11yAnnouncement}</div>

              {/* EMERGENCY HUB MODAL */}
              {showEmergencyHub && (
                <div className="fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6">
                  <div className="w-full max-w-md bg-slate-900 border-2 border-rose-500/50 rounded-[2rem] p-6 shadow-[0_0_50px_rgba(225,29,72,0.3)]">
                    <div className="flex items-center justify-center gap-3 mb-8">
                      <div className="bg-rose-500 p-3 rounded-full animate-pulse" aria-hidden="true">
                        <i className="fa-solid fa-phone text-white text-2xl"></i>
                      </div>
                      <h2 className="text-3xl font-black text-white uppercase tracking-wider">{t.sosHub}</h2>
                    </div>

                    <div className="space-y-4">
                      <a href="tel:112" className="flex items-center justify-between bg-rose-600 hover:bg-rose-700 text-white p-5 rounded-2xl font-bold text-xl active:scale-95 transition-transform">
                        <span>Emergency (112)</span><i className="fa-solid fa-phone text-xl" aria-hidden="true"></i>
                      </a>
                      <a href="tel:1091" className="flex items-center justify-between bg-pink-600 hover:bg-pink-700 text-white p-5 rounded-2xl font-bold active:scale-95 transition-transform">
                        <span>{t.helplineWomen}</span><i className="fa-solid fa-phone text-xl" aria-hidden="true"></i>
                      </a>
                      <a href="tel:1930" className="flex items-center justify-between bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-2xl font-bold active:scale-95 transition-transform">
                        <span>{t.helplineCyber}</span><i className="fa-solid fa-phone text-xl" aria-hidden="true"></i>
                      </a>
                      <div className="h-px bg-white/10 my-6"></div>
                      <a href="https://www.google.com/maps/search/nearest+police+station" target="_blank" className="flex items-center justify-between bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 p-5 rounded-2xl font-bold active:scale-95 transition-transform">
                        <span>{t.nearestPolice}</span><i className="fa-solid fa-location-dot text-xl" aria-hidden="true"></i>
                      </a>
                    </div>
                    <button onClick={() => { triggerHaptic(); setShowEmergencyHub(false); }} className="mt-8 w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-4 rounded-2xl font-bold uppercase tracking-widest border border-white/10">
                      {t.close}
                    </button>
                  </div>
                </div>
              )}

              {/* HEADER */}
              <header className="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 sticky top-0 z-30 shadow-lg">
                <div className="max-w-5xl mx-auto p-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl shadow-lg shadow-blue-900/50 border border-blue-400/30" aria-hidden="true">
                      <i className="fa-solid fa-shield-halved text-white text-xl"></i>
                    </div>
                    <div>
                      <h1 className="text-xl font-black text-white leading-tight tracking-wide">{t.title}</h1>
                      <div className="flex items-center gap-2">
                        <span className="relative flex h-2 w-2" aria-hidden="true">
                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${apiStatus === 'fallback' ? 'bg-amber-400' : 'bg-emerald-400'}`}></span>
                          <span className={`relative inline-flex rounded-full h-2 w-2 ${apiStatus === 'fallback' ? 'bg-amber-500' : 'bg-emerald-500'}`}></span>
                        </span>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{apiStatus === 'fallback' ? t.offlineMode : t.liveAPI}</p>
                      </div>
                    </div>
                  </div>
                  <select value={language} onChange={(e) => { triggerHaptic(); setLanguage(e.target.value); }} className="pl-4 pr-4 py-2 bg-slate-800 border border-white/10 rounded-xl font-bold text-slate-200 text-sm cursor-pointer outline-none">
                    <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option>
                  </select>
                </div>
              </header>

              {/* DASHBOARD */}
              <main className="max-w-5xl mx-auto p-4 mt-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* LEFT COL */}
                <section className="lg:col-span-1 space-y-6">
                  <div className="bg-slate-800 p-6 rounded-[2rem] shadow-xl border border-white/5 ring-1 ring-white/10">
                    <button onClick={startListening} className={`w-full mb-6 py-4 rounded-[2rem] flex flex-col items-center gap-2 border-2 ${isListening ? 'bg-rose-500/10 border-rose-500/50 text-rose-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'}`}>
                      <div className={`p-4 rounded-full ${isListening ? 'bg-rose-600 text-white' : 'bg-blue-600 text-white'}`}><i className={`fa-solid fa-microphone text-2xl ${isListening ? 'fa-beat' : ''}`}></i></div>
                      <span className="font-extrabold text-sm uppercase tracking-wide">{isListening ? t.listening : t.tapToSpeak}</span>
                    </button>
                    {micError && <p className="text-center text-sm text-rose-400 mb-4">{t.micError}</p>}
                    
                    <div className="border-t border-white/5 pt-6">
                      <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">{t.selectState}</label>
                      <select value={selectedState} onChange={(e) => setSelectedState(e.target.value)} className="w-full px-4 py-3 bg-slate-900 border border-white/10 rounded-2xl font-bold text-slate-200 text-lg outline-none">
                        {stateList.map(d => (<option key={d.state} value={d.state}>{d.state}</option>))}
                      </select>
                    </div>

                    <div className="mt-6 pt-6 border-t border-white/5 text-center">
                      <div className="flex items-center justify-center gap-2 mb-1 opacity-70"><i className="fa-solid fa-users text-slate-400"></i><h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">{t.population}</h3></div>
                      <p className="text-2xl font-black text-white">{stateData.pop} <span className="text-base font-bold text-slate-400">{t.lakhs}</span></p>
                    </div>
                  </div>

                  <button onClick={handleNextTip} className={`w-full text-left p-6 rounded-[2rem] border transition-all flex items-start gap-4 active:scale-95 ${isSafe ? 'bg-emerald-950/50 border-emerald-900/50 text-emerald-200' : 'bg-orange-950/50 border-orange-900/50 text-orange-200'}`}>
                    <i className={`fa-solid fa-lightbulb text-xl mt-1 ${isSafe ? 'text-emerald-400' : 'text-orange-400'}`}></i>
                    <div className="flex-1">
                      <div className="flex justify-between items-center mb-1"><h4 className="font-extrabold text-xs uppercase opacity-70">{t.tipTitle}</h4><span className="text-[9px] uppercase opacity-50 bg-white/10 px-2 py-0.5 rounded-full">{t.tapForMore}</span></div>
                      <p className="text-sm font-medium">{isSafe ? t.tipSafe[tipIndex] : t.tipDanger[tipIndex]}</p>
                    </div>
                  </button>
                </section>

                {/* RIGHT COL */}
                <section className="lg:col-span-2 space-y-6">
                  <div className={`p-6 md:p-8 rounded-[2rem] shadow-2xl border-2 flex flex-col sm:flex-row items-center justify-between gap-6 ${isSafe ? 'bg-gradient-to-br from-emerald-900/80 to-slate-900 border-emerald-500/30' : 'bg-gradient-to-br from-rose-900/80 to-slate-900 border-rose-500/30'}`}>
                    <div className="flex items-center gap-6">
                      <div className={`p-5 rounded-full border-2 ${isSafe ? 'bg-emerald-500/20 border-emerald-400' : 'bg-rose-500/20 border-rose-400'}`}>
                        <i className={`fa-solid ${isSafe ? 'fa-thumbs-up text-emerald-400' : 'fa-triangle-exclamation text-rose-400'} text-3xl`}></i>
                      </div>
                      <div>
                        <h2 className="text-3xl md:text-4xl font-black text-white">{stateData.state}</h2>
                        <p className={`text-lg font-bold uppercase ${isSafe ? 'text-emerald-400' : 'text-rose-400'}`}>{isSafe ? t.safe : t.danger}</p>
                      </div>
                    </div>
                    <button id="play-audio-btn" onClick={handleReadAloud} className={`px-8 py-5 rounded-full flex items-center gap-3 font-black uppercase tracking-widest border-2 ${isSpeaking ? 'bg-amber-500 text-slate-900 border-amber-300 animate-pulse' : 'bg-slate-800 text-amber-400 border-amber-500/50'}`}>
                      <i className={`fa-solid ${isSpeaking ? 'fa-volume-xmark' : 'fa-volume-high'} text-xl`}></i> {isSpeaking ? t.stopAudio : t.readSummary}
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div className="bg-slate-800 p-6 rounded-[2rem] shadow-lg border border-white/5 relative overflow-hidden">
                      <i className="fa-solid fa-chart-line absolute top-4 right-4 text-6xl opacity-10"></i>
                      <h3 className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest relative z-10">{t.totalCases}</h3>
                      <div className="flex flex-col mb-1 relative z-10">
                        <span className="text-4xl font-black text-white">{stateData.y2022.toLocaleString('en-IN')}</span>
                        <div className={`flex items-center mt-2 text-xs font-bold uppercase ${isTrendUp ? 'text-rose-400' : 'text-emerald-400'}`}>
                          <i className={`fa-solid ${isTrendUp ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'} mr-2`}></i>{Math.abs(yoyChange).toFixed(1)}% vs '21
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-800 p-6 rounded-[2rem] shadow-lg border border-white/5 relative overflow-hidden">
                      <i className="fa-solid fa-circle-check absolute top-4 right-4 text-6xl opacity-10"></i>
                      <h3 className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest relative z-10">{t.policeAction}</h3>
                      <div className="flex flex-col mb-1 relative z-10">
                        <span className="text-4xl font-black text-white">{stateData.charge}%</span>
                        <span className="flex items-center mt-2 text-xs font-bold uppercase text-blue-400"><i className="fa-solid fa-shield-halved mr-2"></i>{t.casesResolved}</span>
                      </div>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div className="bg-slate-800 p-6 rounded-[2rem] shadow-lg border border-white/5 flex flex-col justify-between">
                      <h3 className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest flex items-center gap-1">
                        <i className="fa-solid fa-chart-simple"></i> Trend '20 - '22
                      </h3>
                      <div className="flex-1 flex items-end justify-center py-2">
                         <svg width="100%" height="40" viewBox="0 0 100 40" preserveAspectRatio="none" className="overflow-visible w-full">
                            <line x1="10" y1="0" x2="90" y2="0" stroke="#334155" strokeWidth="1" strokeDasharray="2" />
                            <line x1="10" y1="20" x2="90" y2="20" stroke="#334155" strokeWidth="1" strokeDasharray="2" />
                            <line x1="10" y1="40" x2="90" y2="40" stroke="#334155" strokeWidth="1" strokeDasharray="2" />
                            <polyline points={`${p1} ${p2} ${p3}`} fill="none" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={trendColor}/>
                            <circle cx="10" cy={p1.split(',')[1]} r="4" className={`fill-slate-900 stroke-2 ${trendColor}`} />
                            <circle cx="50" cy={p2.split(',')[1]} r="4" className={`fill-slate-900 stroke-2 ${trendColor}`} />
                            <circle cx="90" cy={p3.split(',')[1]} r="5" className={`fill-white stroke-2 ${trendColor}`} />
                         </svg>
                      </div>
                    </div>

                    <div className="bg-slate-800 p-6 rounded-[2rem] shadow-lg border border-white/5">
                      <h3 className="text-[10px] font-bold text-slate-400 mb-4 uppercase tracking-widest">{t.breakdown}</h3>
                      <div className="space-y-4">
                        <div className="flex items-center gap-3">
                          <div className="p-2 bg-pink-500/20 text-pink-400 rounded-lg"><i className="fa-solid fa-user-shield"></i></div>
                          <div className="flex-1">
                            <div className="flex justify-between text-xs font-bold text-slate-300 mb-1"><span>{t.womenSafety}</span><span>{Math.floor(stateData.rate * 0.18)}%</span></div>
                            <div className="w-full bg-slate-900 h-1.5 rounded-full"><div className="h-full bg-pink-500 rounded-full" style={{width: '18%'}}></div></div>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="p-2 bg-blue-500/20 text-blue-400 rounded-lg"><i className="fa-solid fa-laptop-code"></i></div>
                          <div className="flex-1">
                            <div className="flex justify-between text-xs font-bold text-slate-300 mb-1"><span>{t.cyberCrime}</span><span>{Math.floor(stateData.rate * 0.12)}%</span></div>
                            <div className="w-full bg-slate-900 h-1.5 rounded-full"><div className="h-full bg-blue-500 rounded-full" style={{width: '12%'}}></div></div>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <div className="p-2 bg-amber-500/20 text-amber-400 rounded-lg"><i className="fa-solid fa-car-side"></i></div>
                          <div className="flex-1">
                            <div className="flex justify-between text-xs font-bold text-slate-300 mb-1"><span>{t.autoTheft}</span><span>{Math.floor(stateData.rate * 0.45)}%</span></div>
                            <div className="w-full bg-slate-900 h-1.5 rounded-full"><div className="h-full bg-amber-500 rounded-full" style={{width: '45%'}}></div></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-800 p-6 md:p-8 rounded-[2rem] shadow-lg border border-white/5">
                    <div className="mb-8">
                      <h3 className="text-xl font-black text-white">{t.crimeRate}</h3>
                      <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">{t.rateSubtitle}</p>
                    </div>
                    <div className="space-y-8">
                      <div>
                        <div className="flex justify-between text-sm font-bold mb-3">
                          <span className="text-white text-lg tracking-wide">{stateData.state}</span>
                          <span className="text-white text-xl font-black">{stateData.rate}</span>
                        </div>
                        <div className="w-full bg-slate-900 h-4 rounded-full overflow-hidden shadow-inner border border-white/5">
                          <div className={`h-full rounded-full shadow-[0_0_15px_currentColor] ${isSafe ? 'bg-emerald-500 text-emerald-500' : 'bg-rose-500 text-rose-500'}`} style={{ width: `${Math.min((stateData.rate / 1500) * 100, 100)}%`, transition: 'width 0.8s' }}/>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between text-sm font-bold mb-3">
                          <span className="text-slate-400 text-base uppercase tracking-wider">{t.nationalAvg}</span>
                          <span className="text-slate-300 text-xl font-black">{nationalData.rate}</span>
                        </div>
                        <div className="w-full bg-slate-900 h-4 rounded-full overflow-hidden shadow-inner border border-white/5">
                          <div className="h-full bg-slate-600 rounded-full" style={{ width: `${Math.min((nationalData.rate / 1500) * 100, 100)}%` }}/>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              </main>

              {/* BOTTOM ACTION BAR */}
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[95%] max-w-lg">
                <div className="flex gap-2 bg-slate-900/80 backdrop-blur-2xl p-2 rounded-[2rem] shadow-2xl border border-white/10 ring-1 ring-white/5">
                  <button onClick={() => setShowEmergencyHub(true)} className="flex-[2] flex items-center justify-center gap-2 bg-gradient-to-r from-rose-600 to-rose-700 text-white py-4 px-4 rounded-[1.5rem]">
                    <i className="fa-solid fa-triangle-exclamation animate-pulse"></i><span className="font-black uppercase text-sm">{t.sosHub}</span>
                  </button>
                  <a href={`https://wa.me/?text=${encodedSosText}`} target="_blank" className="flex-1 flex flex-col items-center justify-center bg-emerald-600 text-white py-2 rounded-[1.5rem]">
                    <i className="fa-brands fa-whatsapp text-xl mb-1"></i><span className="font-bold text-[9px] uppercase text-emerald-100">WhatsApp</span>
                  </a>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
